name: ios-simulator-hid-regression

on:
  pull_request:
    paths:
      - ".github/workflows/ios-simulator-hid-regression.yml"
      - "packages/ios-simulator-runtime/native/hid-compatibility.swift"
      - "packages/ios-simulator-runtime/native/ios-simulator-sidecar.swift"
      - "packages/ios-simulator-runtime/native/tests/hid-compatibility-checks.swift"
      - "packages/ios-simulator-runtime/src/native-sidecar/hid-compatibility.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-hid-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hid-regression:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Uses the exact Swift source linked into the helper. These checks use
      # synthetic screen metadata and do not boot or control any simulator.
      - name: Compile HID regression checks
        run: |
          xcrun swiftc \
            packages/ios-simulator-runtime/native/hid-compatibility.swift \
            packages/ios-simulator-runtime/native/tests/hid-compatibility-checks.swift \
            -o "$RUNNER_TEMP/cindy-hid-checks"

      - name: Run HID regression checks
        run: '"$RUNNER_TEMP/cindy-hid-checks"'
